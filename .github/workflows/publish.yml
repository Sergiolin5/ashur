name: publish-core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m pytest -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/core.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sergiolin5/ashur-core:latest
            ghcr.io/sergiolin5/ashur-core:${{ github.sha }}
      - name: Node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/node.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sergiolin5/ashur-node:latest
            ghcr.io/sergiolin5/ashur-node:${{ github.sha }}
