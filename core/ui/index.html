<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ashur">
<title>Ashur</title>
<style>
  :root {
    --bg: #F2F2F7;
    --row: #FFFFFF;
    --label: #000000;
    --secondary: #8A8A8E;
    --separator: rgba(60, 60, 67, 0.18);
    --tint: #5856D6;
    --green: #34C759;
    --amber: #FF9F0A;
    --gray: #AEAEB2;
    --red: #FF3B30;
    --field: #E9E9EE;
    --seg-on: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --row: #1C1C1E;
      --label: #FFFFFF;
      --secondary: #8D8D93;
      --separator: rgba(84, 84, 88, 0.55);
      --tint: #7D7AFF;
      --green: #30D158;
      --amber: #FFB340;
      --gray: #636366;
      --red: #FF453A;
      --field: #2C2C2E;
      --seg-on: #636366;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font: 17px/1.29 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
  }
  header { padding: 28px 4px 18px; }
  h1 {
    margin: 0;
    font: 700 34px/1.12 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .subtitle { margin-top: 4px; color: var(--secondary); font-size: 15px; }
  .subtitle .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    background: var(--green); margin-right: 6px; vertical-align: 1px; }
  .subtitle.stale .live { background: var(--red); }
  .subtitle.locked .live { background: var(--gray); }

  section { margin-top: 26px; }
  h2 {
    margin: 0 0 7px 16px;
    font-size: 13px;
    font-weight: 400;
    color: var(--secondary);
    letter-spacing: 0;
  }
  .group { background: var(--row); border-radius: 12px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 12px;
    min-height: 44px; padding: 11px 16px;
    position: relative;
  }
  .row + .row::before {
    content: ""; position: absolute; top: 0; right: 0; left: 16px;
    border-top: 0.5px solid var(--separator);
  }
  .row.indent + .row.indent::before { left: 37px; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .detail { color: var(--secondary); font-size: 15px; margin-top: 1px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .value { color: var(--secondary); font-size: 15px; white-space: nowrap;
                font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--gray); }
  .dot.full { background: var(--green); }
  .dot.light { background: var(--amber); }
  .dot.offline { background: var(--red); }
  .empty { color: var(--secondary); }
  .note { margin: 7px 16px 0; color: var(--secondary); font-size: 13px; }

  /* the one thing that moves: the node at work */
  .work { display: block; padding: 16px; }
  .work .who { color: var(--secondary); font-size: 15px; }
  .work .count {
    margin-top: 2px;
    font: 600 40px/1.1 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .work .count small { font-size: 17px; font-weight: 400; color: var(--secondary); letter-spacing: 0; }
  .work .folder { margin-top: 6px; color: var(--secondary); font-size: 13px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .bar { margin-top: 12px; height: 3px; border-radius: 2px; background: var(--field); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 30%; border-radius: 2px; background: var(--tint);
           animation: sweep 1.8s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }

  /* sign in */
  .signin { padding: 16px; }
  .signin p { margin: 0 0 12px; color: var(--secondary); font-size: 15px; }
  input {
    width: 100%; font: inherit; color: var(--label);
    background: var(--field); border: 0; border-radius: 10px; padding: 11px 12px;
  }
  button {
    margin-top: 12px; width: 100%; font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1;
    color: #fff; background: var(--tint); border: 0; border-radius: 12px; padding: 14px;
  }
  .error { color: var(--red); font-size: 15px; margin-top: 10px; }
  .link { background: none; color: var(--tint); font-weight: 400; padding: 12px 16px; text-align: left; margin: 0; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* segmented control */
  .seg { display: flex; margin: 0 0 6px; padding: 2px; border-radius: 9px; background: var(--field); }
  .seg button { flex: 1; margin: 0; padding: 7px 0; border-radius: 7px; background: none; color: var(--label);
                font-size: 14px; font-weight: 500; }
  .seg button[aria-selected="true"] { background: var(--seg-on); font-weight: 600;
                box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 0.5px rgba(0,0,0,.04); }

  /* chat */
  #chat { padding-bottom: 120px; }
  .thread { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
  .bubble { max-width: 82%; padding: 9px 14px; border-radius: 19px; white-space: pre-wrap;
            overflow-wrap: anywhere; line-height: 1.32; }
  .bubble.me { align-self: flex-end; background: var(--tint); color: #fff; border-bottom-right-radius: 6px; }
  .bubble.ashur { align-self: flex-start; background: var(--row); border-bottom-left-radius: 6px; }
  .bubble.note { align-self: center; background: none; color: var(--secondary); font-size: 13px;
                 text-align: center; padding: 4px 8px; }
  .bubble.note.bad { color: var(--red); }
  .day { align-self: center; color: var(--secondary); font-size: 12px; margin: 10px 0 2px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--secondary); opacity: .35;
              animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .7; } }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px max(8px, env(safe-area-inset-bottom));
              background: color-mix(in srgb, var(--bg) 82%, transparent);
              -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
              border-top: 0.5px solid var(--separator); }
  .composer .inner { max-width: 640px; margin: 0 auto; }
  .composer form { display: flex; align-items: flex-end; gap: 8px; }
  .composer textarea { flex: 1; resize: none; max-height: 140px; font: inherit; color: var(--label);
              background: var(--row); border: 0.5px solid var(--separator); border-radius: 19px; padding: 8px 14px;
              line-height: 1.29; }
  .composer .send { flex: none; width: 34px; height: 34px; margin: 0 0 2px; padding: 0; border-radius: 50%;
              display: grid; place-items: center; }
  .composer .send:disabled { background: var(--gray); }
  .composer .send svg { width: 18px; height: 18px; }
  .spend { margin: 6px 4px 0; color: var(--secondary); font-size: 12px; text-align: center;
           font-variant-numeric: tabular-nums; }
  .forget { flex: none; width: auto; margin: 0; padding: 6px 10px; border-radius: 8px; font-size: 14px;
            font-weight: 500; background: var(--field); color: var(--red); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ashur</h1>
    <div class="subtitle" id="subtitle"><span class="live"></span><span id="subtitle-text">Conectando…</span></div>
  </header>

  <section id="signin" hidden>
    <div class="group signin">
      <p>Introduce la clave de administrador de keys.json. Se guarda solo en este navegador.</p>
      <form id="signin-form">
        <input id="key" type="password" autocomplete="current-password" placeholder="Clave de administrador" aria-label="Clave de administrador">
        <button type="submit">Conectar</button>
        <div class="error" id="signin-error" hidden></div>
      </form>
    </div>
  </section>

  <div class="seg" role="tablist" id="tabs" hidden>
    <button type="button" role="tab" id="tab-chat" aria-selected="true">Ashur</button>
    <button type="button" role="tab" id="tab-status" aria-selected="false">Estado</button>
  </div>

  <div id="chat" hidden>
    <div class="thread" id="thread" aria-live="polite"></div>
  </div>

  <div id="dashboard" hidden>
    <section>
      <h2>Trabajando ahora</h2>
      <div class="group" id="working"></div>
      <div class="note" id="queued-note" hidden></div>
    </section>

    <section>
      <h2>Dispositivos</h2>
      <div class="group" id="devices"></div>
    </section>

    <section>
      <h2>Inventario</h2>
      <div class="group" id="inventory"></div>
    </section>

    <section>
      <h2>Actividad reciente</h2>
      <div class="group" id="activity"></div>
    </section>

    <section>
      <h2>Recuerdos de Ashur</h2>
      <div class="group" id="memories"></div>
      <div class="note">Ashur los guarda cuando algo le parece útil más adelante. Puedes borrar cualquiera.</div>
    </section>

    <section>
      <div class="group"><button class="link" id="signout" type="button">Olvidar la clave en este navegador</button></div>
    </section>
  </div>
</main>

<div class="composer" id="composer" hidden>
  <div class="inner">
    <form id="chat-form">
      <textarea id="msg" rows="1" placeholder="Escríbele a Ashur" aria-label="Mensaje para Ashur" maxlength="8000"></textarea>
      <button class="send" id="send" type="submit" aria-label="Enviar" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </button>
    </form>
    <div class="spend" id="spend"></div>
  </div>
</div>

<script>
(() => {
  const KEY = "ashur.adminKey";
  const MODE = {
    full: "Disponible", light: "Uso ligero", busy: "Ocupado",
    off: "En pausa", offline: "Desconectado"
  };
  const MODULE = { inventory: "Inventario" };
  const OS = { windows: "Windows", macos: "macOS", linux: "Linux" };
  const $ = (id) => document.getElementById(id);

  let key = null;
  try { key = localStorage.getItem(KEY); } catch (e) {}
  let timer = null;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function row(opts) {
    const r = el("div", "row" + (opts.dot ? " indent" : ""));
    if (opts.dot) r.append(el("span", "dot " + opts.dot));
    const m = el("div", "main");
    m.append(el("div", "title", opts.title));
    if (opts.detail) m.append(el("div", "detail", opts.detail));
    r.append(m);
    if (opts.value) r.append(el("div", "value", opts.value));
    return r;
  }
  function fill(id, nodes, emptyText) {
    const g = $(id);
    g.replaceChildren(...(nodes.length ? nodes : [row({ title: emptyText })]));
    if (!nodes.length) g.firstChild.querySelector(".title").classList.add("empty");
  }
  const nf = new Intl.NumberFormat("es-CO");
  function ago(seconds) {
    if (seconds === null || seconds === undefined) return "";
    const s = Math.max(0, Math.round(seconds));
    if (s < 60) return "hace " + s + " s";
    if (s < 3600) return "hace " + Math.floor(s / 60) + " min";
    if (s < 86400) return "hace " + Math.floor(s / 3600) + " h";
    return "hace " + Math.floor(s / 86400) + " d";
  }
  function duration(seconds) {
    const s = Math.max(0, Math.round(seconds || 0));
    if (s < 60) return s + " s";
    if (s < 3600) return Math.floor(s / 60) + " min";
    return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min";
  }
  function bytes(b) {
    const u = ["B", "KB", "MB", "GB", "TB"];
    let i = 0, v = b || 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i ? v.toFixed(v < 10 ? 1 : 0) : v) + " " + u[i];
  }
  function clock(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
  }
  function describe(ev) {
    const d = ev.detail || {};
    const mod = MODULE[d.module] || d.module || "tarea";
    switch (ev.event) {
      case "register": return "Se unió a Ashur";
      case "reregister": return "Volvió a registrarse";
      case "offline": return "Se desconectó";
      case "back_online": return "Volvió a conectarse";
      case "mode_change": return ({ full: "Quedó disponible", light: "Pasó a uso ligero",
                                    busy: "Se ocupó", off: "Se pausó" })[d.to] || ("Cambió a " + d.to);
      case "task_queued": return "Nueva tarea: " + mod.toLowerCase() + (d.reason === "first join" ? " inicial" : "");
      case "task_start": return "Empezó " + mod.toLowerCase();
      case "task_done": return "Terminó la tarea " + d.task_id;
      case "task_failed": return "Falló la tarea " + d.task_id;
      case "revoked": return "Acceso revocado";
      case "chat": return (d.channel === "atajo" ? "Conversación desde el Atajo" : "Conversación") +
                          (d.provider === "local" ? ", modelo local" : d.provider === "claude" ? ", Claude" : "");
      case "chat_unanswered": return "Mensaje sin responder";
      case "modules_changed": return "Cambió sus capacidades: " + (d.to || []).join(", ");
      case "code_updated": return "Actualizó su código";
      case "restart_requeued": return "Reinició y devolvió su tarea a la cola";
      case "task_yielded": return "Pausó " + mod.toLowerCase() + " para liberar el equipo";
      case "chat_blocked_budget": return "Mensaje bloqueado por el tope de gasto";
      case "chat_error": return "No pudo hablar con Claude";
      case "memory_saved": return "Guardó un recuerdo";
      case "memory_deleted": return d.by === "sergio" ? "Borraste un recuerdo" : "Borró un recuerdo";
      default: return ev.event;
    }
  }

  function render(data) {
    const now = data.now;
    const nodes = data.status.nodes;
    const byId = Object.fromEntries(nodes.map((n) => [n.device_id, n]));

    // working now
    const working = data.running.map((t) => {
      const w = el("div", "work");
      w.append(el("div", "who", (MODULE[t.module] || t.module) + " en " + t.node_id + ", " + duration(t.elapsed_s)));
      const c = el("div", "count", t.entries !== null && t.entries !== undefined ? nf.format(t.entries) : "Empezando");
      if (t.entries !== null && t.entries !== undefined) {
        c.append(" ", el("small", null, t.entries === 1 ? "elemento" : "elementos"));
      }
      w.append(c);
      if (t.folder) w.append(el("div", "folder", "‎" + t.folder));
      const bar = el("div", "bar"); bar.append(el("i")); w.append(bar);
      return w;
    });
    fill("working", working, "Nada en curso.");

    const waiting = data.queued.length;
    const qn = $("queued-note");
    if (waiting) {
      const blocked = data.queued.filter((q) => q.weight === "heavy" && q.target && byId[q.target] && byId[q.target].mode !== "full");
      let text = waiting === 1 ? "1 tarea en espera." : waiting + " tareas en espera.";
      if (blocked.length) {
        const names = [...new Set(blocked.map((q) => q.target))].join(", ");
        text += " Las de " + names + " empiezan cuando el equipo esté libre: 10 minutos sin uso y, si es portátil, conectado a la corriente.";
      }
      qn.textContent = text; qn.hidden = false;
    } else { qn.hidden = true; }

    // devices
    fill("devices", nodes.map((n) => row({
      dot: n.mode,
      title: n.device_id,
      detail: (OS[n.os] || n.os) + ", " + MODE[n.mode].toLowerCase() +
              (data.node_code_version && n.code_version && n.code_version !== data.node_code_version
                ? ", código por actualizar" : ""),
      value: ago(n.last_seen_s_ago)
    })), "Ningún dispositivo todavía.");

    // inventory
    fill("inventory", data.inventory.map((i) => row({
      title: i.node_id,
      detail: nf.format(i.entries) + (i.entries === 1 ? " elemento, " : " elementos, ") +
              nf.format(i.runnable || 0) + ((i.runnable || 0) === 1 ? " ejecutable" : " ejecutables"),
      value: bytes(i.bytes)
    })), "Aún no hay inventarios.");

    // activity
    fill("activity", data.activity.slice(0, 15).map((ev) => row({
      title: describe(ev),
      detail: ev.node_id || "Núcleo",
      value: clock(ev.ts)
    })), "Sin actividad.");

    const online = data.status.online;
    $("subtitle").classList.remove("stale", "locked");
    $("subtitle-text").textContent = "Núcleo " + data.version + ", " + online +
      (online === 1 ? " dispositivo conectado" : " dispositivos conectados");
  }

  async function refresh() {
    if (!key) return showSignin();
    try {
      const r = await fetch("api/overview", { headers: { "X-Admin-Key": key }, cache: "no-store" });
      if (r.status === 401) return showSignin("La clave no es correcta.");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      render(data);
      showBudget(data.budget);
      unlock();
    } catch (e) {
      $("subtitle").classList.add("stale");
      $("subtitle-text").textContent = "Sin conexión con el núcleo. Reintentando…";
    }
  }
  function showSignin(error) {
    key = null;
    try { localStorage.removeItem(KEY); } catch (e) {}
    for (const id of ["dashboard", "chat", "tabs", "composer"]) $(id).hidden = true;
    $("signin").hidden = false;
    historyLoaded = false;
    $("subtitle").classList.add("locked");
    $("subtitle-text").textContent = "Necesita tu clave";
    const er = $("signin-error");
    er.hidden = !error; er.textContent = error || "";
    $("key").focus();
  }
  // --- tabs ---------------------------------------------------------------
  let tab = "chat";
  try { tab = localStorage.getItem("ashur.tab") || "chat"; } catch (e) {}
  let unlocked = false, historyLoaded = false;
  function unlock() {
    if (unlocked) return;                       // only the first successful load switches views
    unlocked = true;
    $("signin").hidden = true; $("tabs").hidden = false;
    showTab(tab);
  }
  function showTab(t) {
    tab = t;
    try { localStorage.setItem("ashur.tab", t); } catch (e) {}
    $("tab-chat").setAttribute("aria-selected", t === "chat");
    $("tab-status").setAttribute("aria-selected", t === "status");
    $("chat").hidden = $("composer").hidden = t !== "chat";
    $("dashboard").hidden = t !== "status";
    if (t === "chat" && !historyLoaded) loadHistory();
    if (t === "status") loadMemories();
  }
  $("tab-chat").addEventListener("click", () => showTab("chat"));
  $("tab-status").addEventListener("click", () => { showTab("status"); refresh(); });

  // --- chat ---------------------------------------------------------------
  const money = new Intl.NumberFormat("es-CO", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
  function showBudget(b) {
    if (!b) return;
    $("spend").textContent = money.format(b.spent_usd) + " de " + money.format(b.budget_usd) + " usados este mes";
  }
  function dayLabel(ts) {
    const d = new Date(ts * 1000), today = new Date();
    const y = new Date(); y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return "Hoy";
    if (d.toDateString() === y.toDateString()) return "Ayer";
    return d.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
  }
  let lastDay = null;
  function bubble(role, text, ts) {
    const th = $("thread");
    if (ts) {
      const day = dayLabel(ts);
      if (day !== lastDay) { th.append(el("div", "day", day)); lastDay = day; }
    }
    const b = el("div", "bubble " + role, text);
    th.append(b);
    window.scrollTo({ top: document.body.scrollHeight });
    return b;
  }
  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, cache: "no-store",
      headers: { "X-Admin-Key": key, "Content-Type": "application/json", ...(opts.headers || {}) } });
    if (r.status === 401) { showSignin("La clave no es correcta."); throw new Error("401"); }
    return r;
  }
  async function loadHistory() {
    historyLoaded = true;
    try {
      const r = await api("api/chat/history?limit=60");
      const data = await r.json();
      $("thread").replaceChildren(); lastDay = null;
      if (!data.messages.length) bubble("note intro", "Escríbele a Ashur. Recuerda lo importante entre conversaciones y puede consultar tus dispositivos.");
      for (const m of data.messages) bubble(m.role === "user" ? "me" : "ashur", m.content, m.ts);
      showBudget(data.budget);
    } catch (e) { historyLoaded = false; }
  }
  const msg = $("msg");
  msg.addEventListener("input", () => {
    msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 140) + "px";
    $("send").disabled = !msg.value.trim() || sending;
  });
  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer: fine)").matches) {
      e.preventDefault(); $("chat-form").requestSubmit();
    }
  });
  let sending = false;
  $("chat-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = msg.value.trim();
    if (!text || sending) return;
    sending = true; $("send").disabled = true;
    document.querySelectorAll(".bubble.intro").forEach((n) => n.remove());
    bubble("me", text, Date.now() / 1000);
    msg.value = ""; msg.style.height = "auto";
    const wait = bubble("ashur", "");
    const dots = el("span", "typing"); dots.append(el("i"), el("i"), el("i")); wait.append(dots);
    try {
      const r = await api("api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
      const data = await r.json();
      wait.remove();
      if (!r.ok) {
        bubble("note bad", (data && data.detail) || "No pude responder.");
      } else if (data.provider === "none") {
        if (data.note) bubble("note", data.note);
        bubble("note bad", data.reply);
        showBudget(data);
      } else {
        bubble("ashur", data.reply);
        const said = [];
        if (data.provider === "local") said.push("Respondió el modelo local en " + data.device + ".");
        if ((data.tools || []).includes("remember")) said.push("Ashur guardó un recuerdo.");
        if (data.note && data.provider !== "local") said.unshift(data.note);
        else if (data.note) said.unshift(data.note.replace(/ Respondí con un modelo local\.$/, ""));
        if (said.length) bubble("note", said.join(" "));
        showBudget(data);
      }
    } catch (err) {
      wait.remove();
      if (String(err.message) !== "401") bubble("note bad", "Sin conexión con el núcleo. Tu mensaje no se envió.");
    } finally {
      sending = false; $("send").disabled = !msg.value.trim();
    }
  });

  // --- memories -----------------------------------------------------------
  async function loadMemories() {
    try {
      const r = await api("api/memory");
      const list = await r.json();
      fill("memories", list.slice().reverse().map((m) => {
        const r = row({ title: m.text, detail: new Date(m.created * 1000).toLocaleDateString("es-CO",
                        { day: "numeric", month: "short", year: "numeric" }) });
        r.querySelector(".title").style.whiteSpace = "normal";
        const b = el("button", "forget", "Olvidar"); b.type = "button";
        b.setAttribute("aria-label", "Olvidar: " + m.text);
        b.addEventListener("click", async () => {
          b.disabled = true;
          await api("api/memory/" + m.id, { method: "DELETE" });
          loadMemories();
        });
        r.append(b);
        return r;
      }), "Ashur todavía no ha guardado recuerdos.");
    } catch (e) {}
  }

  function loop() {
    clearTimeout(timer);
    if (document.visibilityState === "visible" && (tab === "status" || !unlocked)) refresh();
    timer = setTimeout(loop, 3000);
  }

  $("signin-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("key").value.trim();
    if (!v) return;
    key = v;
    try { localStorage.setItem(KEY, v); } catch (err) {}
    $("key").value = "";
    unlocked = false;
    refresh();
  });
  $("signout").addEventListener("click", () => showSignin());
  document.addEventListener("visibilitychange", loop);
  loop();
})();
</script>
</body>
</html>
