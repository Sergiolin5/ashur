# Ashur core for ZimaOS: App Store -> "+" -> Install a customized app -> Import.
# The image is built and published by GitHub Actions on every push to main.
# Keys are generated on first start into /DATA/AppData/ashur/keys.json.
# Ashur's persona lives in /DATA/AppData/ashur/persona.md (created on first chat; edit freely).
name: ashur
services:
  ashur-core:
    image: ghcr.io/sergiolin5/ashur-core:latest
    container_name: ashur-core
    restart: unless-stopped
    ports:
      - "8711:8000"              # tailnet door: nodes and admin
      - "127.0.0.1:8712:8001"    # public door, only for Tailscale Funnel on this machine
    volumes:
      - /DATA/AppData/ashur:/data
    environment:
      ASHUR_DB: /data/ashur.db
      ASHUR_BRAIN: auto                # auto: Claude if it works, else a local model | claude | local
      ASHUR_MODEL: claude-sonnet-5-5
      ASHUR_MONTHLY_BUDGET_USD: "10"
      # ANTHROPIC_API_KEY: add it in ZimaOS (app settings > environment), never in this file
    deploy:
      resources:
        limits:
          memory: 512M
